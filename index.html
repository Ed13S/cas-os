<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAS OS — document calculator</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/algebrite@1.4.0/dist/algebrite.bundle-for-browser.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="calculator" aria-label="CAS OS document calculator">
    <header class="case-top"><span class="logo">CAS OS</span><span>STUDENT · CAS</span></header>
    <section class="screen-frame">
      <div class="screen">
        <header class="screenbar">
          <button id="documents" class="icon-button" title="Documents">▤</button>
          <strong id="documentName">My Document</strong>
          <span id="saveStatus">Saved</span>
          <button id="newPage" class="icon-button" title="New page">＋</button>
        </header>
        <div id="workspace" class="workspace"></div>
        <footer class="screenhelp"><span id="contextHint">Enter evaluates • Tab adds a math row</span><span>◀ ▶ to switch page</span></footer>
      </div>
    </section>
    <section class="controls">
      <div class="touchpad"><button data-nav="up">▲</button><button data-nav="left">◀</button><button data-nav="select">●</button><button data-nav="right">▶</button><button data-nav="down">▼</button></div>
      <div class="keys">
        <button data-key="doc">doc</button><button data-key="menu">menu</button><button data-key="esc">esc</button><button data-key="del">del</button><button data-key="^">xⁿ</button><button data-key="sqrt(">√</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="/">÷</button><button data-key="sin(">sin</button><button data-key="cos(">cos</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="*">×</button><button data-key="tan(">tan</button><button data-key="(">(</button>
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="-">−</button><button data-key=")">)</button><button data-key=",">,</button>
        <button class="zero" data-key="0">0</button><button data-key=".">.</button><button data-key="+">+</button><button class="enter" data-key="enter">enter</button>
      </div>
    </section>
    <footer class="case-bottom">CAS OS • Browser document workspace</footer>
  </main>
  <dialog id="documentDialog">
    <form method="dialog">
      <h2>Documents</h2>
      <label>Document name <input id="nameInput" maxlength="50"></label>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button id="rename">Rename</button></div>
      <hr>
      <div class="file-actions"><button id="exportDoc" type="button">Export CAS OS document</button><label class="file-label">Import document<input id="importDoc" type="file" accept=".casdoc,application/json"></label></div>
      <p class="note">Exports use the open <code>.casdoc</code> format. They are not TI <code>.tns</code> files, which are proprietary.</p>
    </form>
  </dialog>
</body>
</html>
