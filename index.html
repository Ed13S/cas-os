<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAS OS</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script><script defer src="https://cdn.jsdelivr.net/npm/algebrite@1.4.0/dist/algebrite.bundle-for-browser.js"></script><script defer src="app.js"></script></head><body><main class="device"><header><b>CAS OS</b><span>Student CAS</span></header><section class="bezel"><div class="screen"><div class="bar"><button id="docs">▤ Docs</button><strong id="name">My Document</strong><button id="clear">Clear</button><button id="deletePage">Delete page</button><button id="addPage">＋ Page</button></div><div id="work"></div><footer>Enter = evaluate and add next row • Menu = commands</footer></div></section><section class="hardware"><div class="side"><button data-action="docs">doc</button><button data-action="menu">menu</button><button data-action="clear">clear</button></div><div class="pad"><button data-nav="up">▲</button><button data-nav="left">◀</button><button data-nav="center">●</button><button data-nav="right">▶</button><button data-nav="down">▼</button></div><div class="keys"><button data-insert="^">x²</button><button data-insert="sqrt(">√</button><button data-insert="sin(">sin</button><button data-insert="cos(">cos</button><button data-insert="7">7</button><button data-insert="8">8</button><button data-insert="9">9</button><button data-insert="/">÷</button><button data-insert="4">4</button><button data-insert="5">5</button><button data-insert="6">6</button><button data-insert="*">×</button><button data-insert="1">1</button><button data-insert="2">2</button><button data-insert="3">3</button><button data-insert="-">−</button><button data-insert="0" class="wide">0</button><button data-insert=".">.</button><button data-insert="+">+</button><button data-action="del">del</button><button data-action="enter" class="enter">enter</button></div></section><section class="letters"><button data-insert="a">A</button><button data-insert="b">B</button><button data-insert="c">C</button><button data-insert="d">D</button><button data-insert="e">E</button><button data-insert="f">F</button><button data-insert="g">G</button><button data-insert="h">H</button><button data-insert="i">I</button><button data-insert="j">J</button><button data-insert="k">K</button><button data-insert="l">L</button><button data-insert="m">M</button><button data-insert="n">N</button><button data-insert="o">O</button><button data-insert="p">P</button><button data-insert="q">Q</button><button data-insert="r">R</button><button data-insert="s">S</button><button data-insert="t">T</button><button data-insert="u">U</button><button data-insert="v">V</button><button data-insert="w">W</button><button data-insert="x">X</button><button data-insert="y">Y</button><button data-insert="z">Z</button></section></main><dialog id="picker"><h2>Add page</h2><div id="pageTypes"></div><button class="close">Cancel</button></dialog><dialog id="commands"><h2>Math menu</h2><div id="commandTypes"></div><button class="close">Close</button></dialog><dialog id="documents"><h2>Documents</h2><label>Name <input id="docName"></label><button id="rename">Rename</button><button id="newDoc">New document</button><button id="export">Export .casdoc</button><label class="file">Import .casdoc<input id="import" type="file" accept=".casdoc,application/json"></label><button class="close">Close</button></dialog></body></html>
